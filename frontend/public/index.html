<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS Quiz App</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="color-scheme" content="light dark">
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center">
  <div class="w-full max-w-xl px-6">
    <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-8 shadow-lg">
      <h1 class="text-2xl font-bold mb-6 text-center">
        AWS クイズアプリ
      </h1>

      <p class="text-slate-300 text-center mb-8">
        利用する役割を選択してください
      </p>

      <div class="grid gap-4">
        <!-- Host -->
        <a href="./host.html" class="block rounded-xl border border-slate-700 bg-slate-800/60 p-6 hover:bg-slate-700 transition">
          <div class="text-lg font-semibold">🎤 出題者（Host）</div>
          <div class="text-sm text-slate-400 mt-1">
            クイズの出題・進行・スコアボード表示
          </div>
        </a>

        <!-- Team -->
        <a href="./team.html" class="block rounded-xl border border-slate-700 bg-slate-800/60 p-6 hover:bg-slate-700 transition">
          <div class="text-lg font-semibold">🧑‍💻 回答者（Team）</div>
          <div class="text-sm text-slate-400 mt-1">
            チーム名を入力してクイズに回答
          </div>
        </a>
      </div>

      <div class="mt-8 text-center text-xs text-slate-500">
        ※ 回答は必ず「回答者（Team）」画面から行ってください
      </div>
    </div>
  </div>
</body>
</html>
