# 重要：フロントへ返す questionId は QuestionHash（=DDB PK）とする
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: aws-quiz-app backend (Python 3.14)

Parameters:
  StageName:
    Type: String
    Default: dev

  BedrockModelId:
    Type: String
    Default: jp.anthropic.claude-sonnet-4-5-20250929-v1:0

  BedrockGuardrailIdentifier:
    Type: String
    Default: ""
    Description: "Bedrock Guardrail ID or ARN (optional)"

  BedrockGuardrailVersion:
    Type: String
    Default: "DRAFT"
    Description: "Bedrock Guardrail Version (DRAFT for latest)"

  FrontendOrigin:
    Type: String
    Default: https://CHANGE_ME_FRONTEND_DOMAIN
  CloudFrontToApiHeaderValue:
    Type: String
    NoEcho: true
    Default: CHANGE_ME_CLOUDFRONT_SECRET

  McpEndpoint:
    Type: String
    Default: https://knowledge-mcp.global.api.aws

  HostKey:
    Type: String
    NoEcho: true
    Default: CHANGE_ME_HOST_KEY

Globals:
  Function:
    Runtime: python3.14
    Timeout: 60
    MemorySize: 2048
    Tracing: Active
    Architectures:
      - arm64
    Environment:
      Variables:
        STAGE_NAME: !Ref StageName
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_GUARDRAIL_IDENTIFIER: !Ref BedrockGuardrailIdentifier
        BEDROCK_GUARDRAIL_VERSION: !Ref BedrockGuardrailVersion
        QUIZ_TABLE_NAME: !Ref QuizHistoryTable
        MAX_ATTEMPTS: "1"
        MAX_MCP_REFRESH: "2"
        DUPLICATE_HINT_WINDOW: "15"
        SOURCE_CONTEXT_MAX_CHARS: "1500"
        SOURCE_SNIPPETS_MAX: "3"
        MCP_ENDPOINT: !Ref McpEndpoint
        MCP_API_KEY: "" # 基本的に不要
        HOST_KEY: !Ref HostKey
        LOG_LEVEL: INFO

Resources:
  QuizApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowHeaders:
          - content-type
          - authorization
          - x-host-key
        AllowMethods:
          - GET
          - POST
          - OPTIONS

      Auth:
        Authorizers:
          CloudFrontHeaderAuthorizer:
            AuthorizerPayloadFormatVersion: 2.0
            EnableSimpleResponses: true
            FunctionArn: !GetAtt CloudFrontHeaderAuthorizerFunction.Arn
            Identity:
              Headers:
                - X-From-CloudFront
        DefaultAuthorizer: CloudFrontHeaderAuthorizer

  CloudFrontHeaderAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.lambda_handler
      InlineCode: |
        import os

        def lambda_handler(event, context):
            headers = event.get('headers') or {}
            # HTTP API v2 payload normalizes header keys to lower-case
            expected_name = (os.environ.get('CF_HEADER_NAME') or '').strip()
            expected_value = (os.environ.get('CF_HEADER_VALUE') or '').strip()

            if not expected_name or not expected_value:
                # Misconfiguration: fail closed
                return {'isAuthorized': False}

            got = headers.get(expected_name.lower())
            return {'isAuthorized': bool(got) and got == expected_value}
      Environment:
        Variables:
          CF_HEADER_NAME: X-From-CloudFront
          CF_HEADER_VALUE: !Ref CloudFrontToApiHeaderValue

  CloudFrontHeaderAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CloudFrontHeaderAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${QuizApi}/*

  QuizHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: QuestionHash
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: QuestionHash
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_Recent
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - Category
              - Level
              - Question
              - Tags
              - Rubric
              - CreatedAt

  ScoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-QuizScores"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: teamId
          AttributeType: S
      KeySchema:
        - AttributeName: teamId
          KeyType: HASH

  AnswerHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-AnswerHistory"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: teamId
          AttributeType: S
        - AttributeName: questionId
          AttributeType: S
      KeySchema:
        - AttributeName: teamId
          KeyType: HASH
        - AttributeName: questionId
          KeyType: RANGE

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: aws-quiz-app-common
      Description: Shared common modules for aws-quiz-app backend
      ContentUri: layers/common/
      CompatibleRuntimes:
        - python3.14
      CompatibleArchitectures:
        - arm64
    RetentionPolicy: Delete

  # Bedrockのプロンプトマネジメント定義
  QuizPrompt:
    Type: AWS::Bedrock::Prompt
    Properties:
      Name: !Sub "${AWS::StackName}-quiz-prompt"
      Description: "AWS quiz generation prompt (managed)"
      Variants:
        - Name: "default"
          ModelId: !Ref BedrockModelId # ← 生成AIリソースは「モデル」
          TemplateType: "CHAT"
          InferenceConfiguration:
            Text:
              MaxTokens: 2400
              Temperature: 0.15
          TemplateConfiguration:
            Chat:
              InputVariables:
                - Name: "category"
                - Name: "level"
                - Name: "avoid_duplicate_hint"
                - Name: "question_style"
                - Name: "style_guidance"
                - Name: "source_context"
              System:
                - Text: |
                    AWS教育用クイズ作成者。SOURCE_CONTEXTのみを根拠に、日本語で1問生成。
                    
                    必須ルール:
                    - JSONのみ出力（コードフェンス・説明文禁止）
                    - SOURCE_CONTEXTにない事実は断定しない
                    - rubric必須（Must/Nice/Wrong/ScoringPolicy）
                    - level: 100=基礎、200=設計、300=実装、400=専門家
                    - correct=100%、close=80%を満たすScoringPolicy
                    - 明確な回答を求める（YES/NO禁止）
                    - 多様な観点・表現で出題（同じパターンを避ける）
                    - JSON構造を完全に閉じる（すべての}と]を忘れずに）
                    - クイズはトンチを利かしたり、ユーモアに富んだ文章とする。
              Messages:
                - Role: "user"
                  Content:
                    - Text: |
                        category={{category}}, level={{level}}, style={{question_style}}
                        
                        制約（厳守）:
                        - title≤55字, body≤240字, expectedAnswer≤240字, sourceSummary≤160字
                        - mustHavePoints.label≤35字, notes≤70字
                        - keywords_any: 各要素は必ず10字以内（重要！）
                        - mustHavePointsは4個、niceToHavePointsは0-1個、commonWrongClaimsは0-1個
                        - JSONのみ出力（```禁止）、必ず完全なJSONを出力
                        - 簡潔に書く（冗長な説明を避ける）
                        
                        重複回避（必ず異なる観点で）:
                        {{avoid_duplicate_hint}}
                        
                        出題方針（この型に沿う）:
                        {{style_guidance}}
                        
                        根拠:
                        {{source_context}}
                        
                        出力形式（必ず完全なJSONを出力）:
                        {"title":"","body":"","category":"","level":0,"rubric":{"expectedAnswer":"","mustHavePoints":[{"id":"p1","label":"","keywords_any":[""],"notes":""}],"niceToHavePoints":[],"commonWrongClaims":[],"scoringPolicy":{"correct_threshold":1.0,"close_threshold":0.8,"must_points_total":4,"close_if_must_points_met_at_least":3,"correct_if_must_points_met_at_least":4}},"sourceSummary":"","tags":[]}

  QuizPromptVersion:
    Type: AWS::Bedrock::PromptVersion
    Properties:
      PromptArn: !GetAtt QuizPrompt.Arn
      Description: !GetAtt QuizPrompt.UpdatedAt # Prompt更新で差分が出て「最新version」が発行される

  GetNextQuizFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          BEDROCK_PROMPT_ARN: !Ref QuizPromptVersion
      Handler: app.lambda_handler
      CodeUri: src/get_next_quiz/
      Timeout: 60
      MemorySize: 2048
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QuizHistoryTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:RenderPrompt
                - bedrock:ApplyGuardrail
              Resource: "*"
      Events:
        GetNextQuiz:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuizApi
            Path: /quiz/next
            Method: GET

  GetCurrentQuizFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      CodeUri: src/get_current_quiz/
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref QuizHistoryTable
      Events:
        GetCurrentQuiz:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuizApi
            Path: /quiz/current
            Method: GET

  JudgeAnswerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      CodeUri: src/judge_answer/
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QuizHistoryTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:ApplyGuardrail
              Resource: "*"
      Events:
        JudgeAnswer:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuizApi
            Path: /quiz/answer
            Method: POST

  # HttpApi + ApiId: !Ref QuizApi に統合
  SubmitScoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/submit_score/
      Handler: app.handler
      Environment:
        Variables:
          SCORES_TABLE_NAME: !Ref ScoresTable
          ANSWER_HISTORY_TABLE_NAME: !Ref AnswerHistoryTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ScoresTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AnswerHistoryTable
      Events:
        SubmitScore:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuizApi
            Path: /scores/submit
            Method: POST

  GetScoresFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/get_scores/
      Handler: app.handler
      Environment:
        Variables:
          SCORES_TABLE_NAME: !Ref ScoresTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScoresTable
      Events:
        GetScores:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuizApi
            Path: /scores
            Method: GET

  # ==============================
  # 復習用：questionId 指定取得
  # GET /quiz/question
  # ==============================
  GetQuizByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-get-quiz-by-id"
      CodeUri: src/get_quiz_by_id/
      Handler: app.lambda_handler
      Runtime: python3.14
      MemorySize: 512
      Layers:
        - !Ref CommonLayer
      Timeout: 10
      Environment:
        Variables:
          QUIZ_TABLE_NAME: !Ref QuizHistoryTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref QuizHistoryTable
      Events:
        GetQuizByIdApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuizApi
            Path: /quiz/question
            Method: get

# Bedrock Prompt Management Define

Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint
    Value: !Sub https://${QuizApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}

  ApiGatewayDomainName:
    Description: Domain name for CloudFront Origin (no scheme, no stage)
    Value: !Sub ${QuizApi}.execute-api.${AWS::Region}.amazonaws.com

  ApiGatewayOriginPath:
    Description: Origin path (stage) for CloudFront OriginPath
    Value: !Sub /${StageName}
