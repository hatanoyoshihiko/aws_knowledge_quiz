# 重要：フロントへ返す questionId は QuestionHash（=DDB PK）とする
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: aws-quiz-app backend (Python 3.14)

Parameters:
  StageName:
    Type: String
    Default: dev

  BedrockModelId:
    Type: String
    Default: jp.anthropic.claude-sonnet-4-5-20250929-v1:0

  FrontendOrigin:
    Type: String
    Default: https://CHANGE_ME_FRONTEND_DOMAIN
  CloudFrontToApiHeaderValue:
    Type: String
    NoEcho: true
    Default: CHANGE_ME_CLOUDFRONT_SECRET

  McpEndpoint:
    Type: String
    Default: https://knowledge-mcp.global.api.aws

  HostKey:
    Type: String
    NoEcho: true
    Default: CHANGE_ME_HOST_KEY

Globals:
  Function:
    Runtime: python3.14
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Architectures:
      - arm64
    Environment:
      Variables:
        STAGE_NAME: !Ref StageName
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        QUIZ_TABLE_NAME: !Ref QuizHistoryTable
        MAX_ATTEMPTS: "1"
        MAX_MCP_REFRESH: "0"
        DUPLICATE_HINT_WINDOW: "20"
        SOURCE_CONTEXT_MAX_CHARS: "2200"
        SOURCE_SNIPPETS_MAX: "6"
        MCP_ENDPOINT: !Ref McpEndpoint
        MCP_API_KEY: "" # 基本的に不要
        HOST_KEY: !Ref HostKey
        LOG_LEVEL: INFO

Resources:
  QuizApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowHeaders:
          - content-type
          - authorization
          - x-host-key
        AllowMethods:
          - GET
          - POST
          - OPTIONS

      Auth:
        Authorizers:
          CloudFrontHeaderAuthorizer:
            AuthorizerPayloadFormatVersion: 2.0
            EnableSimpleResponses: true
            FunctionArn: !GetAtt CloudFrontHeaderAuthorizerFunction.Arn
            Identity:
              Headers:
                - X-From-CloudFront
        DefaultAuthorizer: CloudFrontHeaderAuthorizer

  CloudFrontHeaderAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.lambda_handler
      InlineCode: |
        import os

        def lambda_handler(event, context):
            headers = event.get('headers') or {}
            # HTTP API v2 payload normalizes header keys to lower-case
            expected_name = (os.environ.get('CF_HEADER_NAME') or '').strip()
            expected_value = (os.environ.get('CF_HEADER_VALUE') or '').strip()

            if not expected_name or not expected_value:
                # Misconfiguration: fail closed
                return {'isAuthorized': False}

            got = headers.get(expected_name.lower())
            return {'isAuthorized': bool(got) and got == expected_value}
      Environment:
        Variables:
          CF_HEADER_NAME: X-From-CloudFront
          CF_HEADER_VALUE: !Ref CloudFrontToApiHeaderValue

  CloudFrontHeaderAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CloudFrontHeaderAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${QuizApi}/*

  QuizHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: QuestionHash
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: QuestionHash
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_Recent
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - Category
              - Level
              - Question
              - Tags
              - Rubric
              - CreatedAt

  ScoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-QuizScores"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: teamId
          AttributeType: S
      KeySchema:
        - AttributeName: teamId
          KeyType: HASH

  AnswerHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-AnswerHistory"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: teamId
          AttributeType: S
        - AttributeName: questionId
          AttributeType: S
      KeySchema:
        - AttributeName: teamId
          KeyType: HASH
        - AttributeName: questionId
          KeyType: RANGE

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: aws-quiz-app-common
      Description: Shared common modules for aws-quiz-app backend
      ContentUri: layers/common/
      CompatibleRuntimes:
        - python3.14
      CompatibleArchitectures:
        - arm64
    RetentionPolicy: Delete

  # Bedrockのプロンプトマネジメント定義
  QuizPrompt:
    Type: AWS::Bedrock::Prompt
    Properties:
      Name: !Sub "${AWS::StackName}-quiz-prompt"
      Description: "AWS quiz generation prompt (managed)"
      Variants:
        - Name: "default"
          ModelId: !Ref BedrockModelId # ← 生成AIリソースは「モデル」
          TemplateType: "CHAT"
          InferenceConfiguration:
            Text:
              MaxTokens: 2200
              Temperature: 0.2
          TemplateConfiguration:
            Chat:
              InputVariables:
                - Name: "category"
                - Name: "level"
                - Name: "avoid_duplicate_hint"
                - Name: "question_style"
                - Name: "style_guidance"
                - Name: "source_context"
              System:
                - Text: |
                    あなたはAWSソリューションアーキテクト兼、社内教育用のAWSクイズ作成者です。
                    ルール:
                    - 入力で与えられる SOURCE_CONTEXT のみを根拠にすること。
                    - SOURCE_CONTEXTにない事実を断定しない。不明なら出題しない。
                    - 日本語で、社内学習に適した明確な問題にする。
                    - 出力は必ずJSONのみ（前後に文章やコードフェンスを付けない）。
                    - 1問だけ生成する。
                    - rubric（Must/Nice/Wrong/ScoringPolicy）を必ず含める。
                    - level は AWSセッションレベル（100/200/300/400）を数値で使用する。
                      - 100: 基礎概念、200: 設計/推奨、300: 実装/運用、400: 専門家/トレードオフ
                    - ScoringPolicyは correct=100%, close=80% を満たすように定義する。
                    - クイズはトンチを利かしたり、ユーモアに富んだ文章とする。
                    - 誤解を招く表現はしないこと。
                    - 設問に対しての回答を明確に求め、YESやNOの表現だけを回答として求めないこと。
                    - 現在時刻で廃止が決定されている仕組（SSE-C等）は出題しないこと。
              Messages:
                - Role: "user"
                  Content:
                    - Text: |
                        次の制約でAWSクイズを1問生成してください。

                        [CONSTRAINTS]
                        - 文字数制約（必ず守る）:
                          - title: 60文字以内
                          - body: 340文字以内
                          - sourceSummary: 220文字以内
                          - rubric.expectedAnswer: 300文字以内
                          - mustHavePoints.label: 60文字以内、notes: 120文字以内
                          - keywords_any: 各要素 20文字以内、各ポイント最大 8 個
                        - JSONはコードフェンス禁止（```json など禁止）
                        - JSON以外の文章を一切出力しない
                        - category: {{category}}
                        - level: {{level}}
                        - language: ja
                        - avoid_duplicate_hint:
                        {{avoid_duplicate_hint}}

                        [QUESTION_STYLE]
                        次の「型」に沿って出題してください（同じ論点の焼き直しを避ける）:
                        - style: {{question_style}}
                        - style_guidance:
                        {{style_guidance}}

                        [SOURCE_CONTEXT]
                        {{source_context}}

                        [OUTPUT_JSON_SCHEMA]
                        {
                          "title": "string",
                          "body": "string",
                          "category": "string",
                          "level": 0,
                          "rubric": {
                            "expectedAnswer": "string",
                            "mustHavePoints": [
                              {"id":"p1","label":"string","keywords_any":["string"],"notes":"string"}
                            ],
                            "niceToHavePoints": [
                              {"id":"n1","label":"string","keywords_any":["string"],"notes":"string"}
                            ],
                            "commonWrongClaims": [
                              {"id":"w1","label":"string","keywords_any":["string"],"notes":"string"}
                            ],
                            "scoringPolicy": {
                              "correct_threshold": 1.0,
                              "close_threshold": 0.8,
                              "must_points_total": 0,
                              "close_if_must_points_met_at_least": 0,
                              "correct_if_must_points_met_at_least": 0
                            }
                          },
                          "sourceSummary": "string",
                          "tags": ["string"]
                        }

                        mustHavePointsは4〜6個にしてください。

  QuizPromptVersion:
    Type: AWS::Bedrock::PromptVersion
    Properties:
      PromptArn: !GetAtt QuizPrompt.Arn
      Description: !GetAtt QuizPrompt.UpdatedAt # Prompt更新で差分が出て「最新version」が発行される

  GetNextQuizFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          BEDROCK_PROMPT_ARN: !Ref QuizPromptVersion
      Handler: app.lambda_handler
      CodeUri: src/get_next_quiz/
      Timeout: 60
      MemorySize: 1024
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QuizHistoryTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:RenderPrompt
              Resource: "*"
      Events:
        GetNextQuiz:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuizApi
            Path: /quiz/next
            Method: GET

  GetCurrentQuizFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      CodeUri: src/get_current_quiz/
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref QuizHistoryTable
      Events:
        GetCurrentQuiz:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuizApi
            Path: /quiz/current
            Method: GET

  JudgeAnswerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      CodeUri: src/judge_answer/
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QuizHistoryTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        JudgeAnswer:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuizApi
            Path: /quiz/answer
            Method: POST

  # HttpApi + ApiId: !Ref QuizApi に統合
  SubmitScoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/submit_score/
      Handler: app.handler
      Environment:
        Variables:
          SCORES_TABLE_NAME: !Ref ScoresTable
          ANSWER_HISTORY_TABLE_NAME: !Ref AnswerHistoryTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ScoresTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AnswerHistoryTable
      Events:
        SubmitScore:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuizApi
            Path: /scores/submit
            Method: POST

  GetScoresFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/get_scores/
      Handler: app.handler
      Environment:
        Variables:
          SCORES_TABLE_NAME: !Ref ScoresTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScoresTable
      Events:
        GetScores:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuizApi
            Path: /scores
            Method: GET

  # ==============================
  # 復習用：questionId 指定取得
  # GET /quiz/question
  # ==============================
  GetQuizByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-get-quiz-by-id"
      CodeUri: src/get_quiz_by_id/
      Handler: app.lambda_handler
      Runtime: python3.14
      MemorySize: 512
      Layers:
        - !Ref CommonLayer
      Timeout: 10
      Environment:
        Variables:
          QUIZ_TABLE_NAME: !Ref QuizHistoryTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref QuizHistoryTable
      Events:
        GetQuizByIdApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuizApi
            Path: /quiz/question
            Method: get

# Bedrock Prompt Management Define

Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint
    Value: !Sub https://${QuizApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}

  ApiGatewayDomainName:
    Description: Domain name for CloudFront Origin (no scheme, no stage)
    Value: !Sub ${QuizApi}.execute-api.${AWS::Region}.amazonaws.com

  ApiGatewayOriginPath:
    Description: Origin path (stage) for CloudFront OriginPath
    Value: !Sub /${StageName}
